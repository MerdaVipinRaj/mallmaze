<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1280, initial-scale=0.35, minimum-scale=0.25, maximum-scale=3.0, user-scalable=yes" />
    <title>MallMaze - Local Stores</title>
    <meta name="description" content="Create local store websites for nearby shops and manage each store banner, QR, verification, and products manually." />
    <link rel="stylesheet" href="assets/css/tailwind.css">
    <link rel="stylesheet" href="assets/css/react-styles.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/product-camera-studio.css">

    <!--
      Old Connect OS kept for later use. These are intentionally commented out.

        <main class="connect-os-page">
          <div id="autoshelf-root"></div>
        </main>
        <script src="assets/js/product-camera-studio.js"></script>
</body>
      <script src="assets/js/config.js" defer></script>
      <script src="assets/js/api-client.js" defer></script>
      <script src="assets/js/runtime-guard.js" defer></script>
      <script src="assets/js/geolocation.js" defer></script>
    <script src="assets/js/fast-shopping.js" defer></script>

    <style>
      .vs-hero {
        background:
          linear-gradient(135deg, rgba(15, 23, 42, 0.92), rgba(15, 23, 42, 0.68)),
          url("assets/media/hero-mall.jpg");
        background-size: cover;
        background-position: center;
      }

      .vs-input {
        width: 100%;
        max-width: 100%;
        border: 1px solid hsl(var(--border));
        border-radius: 0.65rem;
        background: #ffffff;
        padding: 0.7rem 0.85rem;
        font-size: 0.95rem;
        outline: none;
      }

      .vs-input:focus {
        border-color: #f59e0b;
        box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.16);
      }

      .vs-input[type="file"] {
        padding: 0.65rem 0.8rem;
      }

      .vs-label {
        display: grid;
        gap: 0.45rem;
        min-width: 0;
        color: #334155;
        font-size: 0.82rem;
        font-weight: 800;
      }

      .vs-compact-form {
        max-width: 780px;
      }

      .vs-field-row {
        display: grid;
        gap: 1rem;
      }

      @media (min-width: 640px) {
        .vs-field-row {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      .vs-field-wide {
        max-width: 780px;
      }

      .vs-search-panel {
        display: grid;
        gap: 0.75rem;
        width: min(100%, 720px);
        margin-top: 1.5rem;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 1rem;
        background: rgba(255, 255, 255, 0.12);
        padding: 0.85rem;
        backdrop-filter: blur(14px);
      }

      .vs-search-grid {
        display: grid;
        gap: 0.75rem;
      }

      @media (min-width: 640px) {
        .vs-search-grid {
          grid-template-columns: minmax(0, 1fr) auto;
          align-items: end;
        }
      }

      .vs-search-label {
        display: grid;
        gap: 0.35rem;
        min-width: 0;
        color: rgba(255, 255, 255, 0.72);
        font-size: 0.72rem;
        font-weight: 900;
        text-transform: uppercase;
      }

      .vs-search-input {
        width: min(100%, 520px);
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 0.75rem;
        background: rgba(255, 255, 255, 0.94);
        color: #0f172a;
        padding: 0.78rem 0.95rem;
        font-size: 0.95rem;
        font-weight: 700;
        outline: none;
      }

      .vs-search-input::placeholder,
      .vs-input::placeholder {
        color: #94a3b8;
        font-weight: 600;
      }

      .vs-search-input:focus {
        border-color: #fbbf24;
        box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.22);
      }

      .vs-filter-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin-top: 1rem;
        border: 1px solid #e2e8f0;
        border-radius: 0.95rem;
        background: #f8fafc;
        padding: 0.85rem;
      }

      .vs-filter-bar .vs-input {
        width: min(100%, 340px);
        background: #ffffff;
      }

      .vs-search-empty {
        border: 1px dashed #cbd5e1;
        border-radius: 0.95rem;
        background: #f8fafc;
        padding: 1rem;
        color: #64748b;
        font-size: 0.9rem;
        font-weight: 700;
      }

      .vs-store-grid .vs-search-empty {
        grid-column: 1 / -1;
      }

      .vs-form-panel {
        position: relative;
        overflow: hidden;
      }

      .vs-form-panel::before {
        content: "";
        position: absolute;
        inset: 0 0 auto 0;
        height: 6px;
        background: linear-gradient(90deg, #f59e0b, #0f766e);
      }

      .vs-admin-note {
        border: 1px solid #fed7aa;
        border-radius: 0.9rem;
        background: #fff7ed;
        color: #9a3412;
        padding: 0.9rem;
        font-size: 0.85rem;
        font-weight: 700;
        line-height: 1.45;
      }

      .vs-hero-stats {
        display: grid;
        gap: 0.75rem;
        margin-top: 1.75rem;
      }

      @media (min-width: 640px) {
        .vs-hero-stats {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      .vs-hero-stat {
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 1rem;
        background: rgba(255, 255, 255, 0.1);
        padding: 1rem;
        color: #ffffff;
        backdrop-filter: blur(12px);
      }

      .vs-hero-stat strong {
        display: block;
        font-size: 1.45rem;
        line-height: 1;
      }

      .vs-hero-stat span {
        display: block;
        margin-top: 0.4rem;
        color: rgba(255, 255, 255, 0.72);
        font-size: 0.78rem;
        font-weight: 800;
      }

      .vs-setup-flow {
        display: grid;
        gap: 0.75rem;
        margin-top: 1rem;
      }

      .vs-setup-flow article {
        border: 1px solid #e2e8f0;
        border-radius: 0.95rem;
        background: #ffffff;
        padding: 0.95rem;
      }

      .vs-setup-flow span {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.75rem;
        height: 1.75rem;
        border-radius: 999px;
        background: #0f766e;
        color: #ffffff;
        font-size: 0.8rem;
        font-weight: 900;
      }

      .vs-setup-flow strong {
        display: block;
        margin-top: 0.6rem;
        color: #0f172a;
        font-size: 0.92rem;
      }

      .vs-setup-flow p {
        margin-top: 0.25rem;
        color: #64748b;
        font-size: 0.8rem;
        line-height: 1.45;
      }

      @media (min-width: 768px) {
        .vs-setup-flow {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }

      .vs-panel-title {
        display: flex;
        min-width: 0;
        align-items: flex-start;
        justify-content: space-between;
        gap: 1rem;
      }

      .vs-section-kicker {
        color: #d97706;
        font-size: 0.72rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .vs-store-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 1.15rem;
        justify-content: start;
      }

      .vs-store-layout {
        display: grid;
        gap: 1.5rem;
      }

      .vs-count-pill {
        display: inline-flex;
        width: fit-content;
        min-width: max-content;
        align-self: flex-start;
        align-items: center;
        justify-content: center;
        border: 1px solid #fde68a;
        border-radius: 999px;
        background: #fffbeb;
        padding: 0.35rem 0.8rem;
        color: #92400e;
        font-size: 0.75rem;
        font-weight: 900;
        line-height: 1;
        white-space: nowrap;
      }

      .vs-store-card {
        display: flex;
        min-width: 0;
        min-height: 100%;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid hsl(var(--border));
        border-radius: 1rem;
        background: #ffffff;
        box-shadow: var(--shadow-card);
        transition: transform 160ms ease, box-shadow 160ms ease;
      }

      .vs-store-card:hover {
        transform: translateY(-2px);
      }

      .vs-store-cover {
        min-height: 150px;
        background-size: cover;
        background-position: center;
        position: relative;
      }

      .vs-store-cover::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.08), rgba(15, 23, 42, 0.64));
      }

      .vs-store-cover-content {
        position: absolute;
        left: 1rem;
        right: 1rem;
        bottom: 1rem;
        z-index: 1;
        color: #ffffff;
      }

      .vs-store-body {
        display: flex;
        flex: 1 1 auto;
        flex-direction: column;
        gap: 0.95rem;
        padding: 1rem;
      }

      .vs-store-body > .mb-3.flex {
        margin-bottom: 0 !important;
        align-items: center;
        justify-content: flex-start;
        border: 1px solid #e2e8f0;
        border-radius: 0.9rem;
        background: #f8fafc;
        padding: 0.75rem;
      }

      .vs-store-body > .mb-3.flex .min-w-0 {
        text-align: left !important;
      }

      .vs-mini-list {
        display: grid;
        gap: 0.65rem;
        margin-top: 0;
      }

      .vs-mini-list p {
        display: grid;
        grid-template-columns: minmax(82px, 0.32fr) minmax(0, 1fr);
        align-items: start;
        gap: 0.75rem;
        border: 1px solid #eef2f7;
        border-radius: 0.8rem;
        background: #ffffff;
        padding: 0.7rem 0.75rem;
        color: #64748b;
        font-size: 0.78rem;
        font-weight: 700;
      }

      .vs-mini-list strong {
        min-width: 0;
        color: #0f172a;
        text-align: left;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      .vs-store-body > .mt-3.flex {
        margin-top: auto !important;
        align-items: flex-start;
        justify-content: flex-start;
      }

      @media (min-width: 820px) {
        .vs-store-card {
          display: grid;
          grid-template-columns: 210px minmax(0, 1fr);
          align-items: stretch;
        }

        .vs-store-cover {
          min-height: 100%;
          height: auto;
        }

        .vs-store-cover-content {
          left: 0.9rem;
          right: 0.9rem;
          bottom: 0.9rem;
        }

        .vs-store-body {
          padding: 1rem 1.1rem;
        }

        .vs-store-body > .mb-3.flex {
          display: grid !important;
          grid-template-columns: auto minmax(0, 1fr);
        }

        .vs-mini-list {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .vs-mini-list p {
          grid-template-columns: minmax(76px, 0.38fr) minmax(0, 1fr);
        }
      }

      .vs-status {
        display: inline-flex;
        align-items: center;
        width: fit-content;
        border-radius: 999px;
        padding: 0.25rem 0.7rem;
        font-size: 0.7rem;
        font-weight: 900;
        text-transform: uppercase;
      }

      .vs-status.pending {
        border: 1px solid #fed7aa;
        background: #fff7ed;
        color: #c2410c;
      }

      .vs-status.verified {
        border: 1px solid #a7f3d0;
        background: #ecfdf5;
        color: #047857;
      }

      .vs-status.rejected {
        border: 1px solid #fecaca;
        background: #fff1f2;
        color: #be123c;
      }

      .vs-upload-preview {
        display: none;
        width: 100%;
        max-height: 220px;
        object-fit: contain;
        border: 1px solid hsl(var(--border));
        border-radius: 0.9rem;
        background: #f8fafc;
        padding: 0.5rem;
      }

      .vs-upload-preview.show {
        display: block;
      }

      .vs-upload-options {
        display: grid;
        gap: 0.75rem;
      }

      @media (min-width: 640px) {
        .vs-upload-options {
          grid-template-columns: 1fr 1fr;
        }

        .vs-admin-shell .vs-upload-options {
          grid-template-columns: 1fr;
        }

        .vs-manage-row {
          grid-template-columns: minmax(0, 1fr) auto;
          align-items: center;
        }
      }

      .vs-upload-control {
        display: grid;
        gap: 0.45rem;
        border: 1px solid hsl(var(--border));
        border-radius: 0.9rem;
        background: #f8fafc;
        padding: 0.85rem;
        color: #334155;
        font-size: 0.82rem;
        font-weight: 900;
      }

      .vs-upload-control input {
        width: 100%;
        font-size: 0.78rem;
        font-weight: 700;
      }

      .vs-upload-control small {
        color: #64748b;
        font-size: 0.72rem;
        font-weight: 700;
      }

      .vs-admin-shell {
        border: 1px solid #e2e8f0;
        border-radius: 1.25rem;
        background: linear-gradient(180deg, #ffffff, #f8fafc);
        box-shadow: var(--shadow-card);
      }

      .vs-admin-shell-head {
        border-bottom: 1px solid #e2e8f0;
        padding: 1rem;
      }

      .vs-admin-shell-body {
        display: grid;
        gap: 1rem;
        padding: 1rem;
      }

      .vs-manage-grid {
        display: grid;
        gap: 1rem;
      }

      @media (min-width: 768px) {
        .vs-manage-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      .vs-banner {
        min-height: 310px;
        background-size: cover;
        background-position: center;
        position: relative;
      }

      .vs-banner::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(15, 23, 42, 0.84), rgba(15, 23, 42, 0.24));
      }

      .vs-banner-content {
        position: relative;
        z-index: 1;
      }

      .vs-product-img {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
        background: #f1f5f9;
      }

      .vs-product-list {
        display: grid;
        gap: 0.9rem;
      }

      .vs-product-row {
        display: grid;
        grid-template-columns: 116px minmax(0, 1fr);
        align-items: stretch;
        min-width: 0;
      }

      .vs-product-media {
        display: block;
        min-height: 100%;
        overflow: hidden;
        background: #f1f5f9;
      }

      .vs-product-row .vs-product-img {
        height: 100%;
        min-height: 132px;
        aspect-ratio: auto;
      }

      .vs-product-row-body {
        display: grid;
        gap: 0.85rem;
        padding: 0.9rem;
      }

      .vs-product-name {
        color: #0f172a;
        font-size: 1rem;
        font-weight: 950;
        line-height: 1.25;
      }

      .vs-product-meta,
      .vs-product-address {
        margin-top: 0.25rem;
        color: #64748b;
        font-size: 0.8rem;
        font-weight: 750;
        line-height: 1.35;
      }

      .vs-product-address {
        color: #94a3b8;
      }

      .vs-product-commerce {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.55rem;
      }

      .vs-product-commerce strong {
        color: #0f172a;
        font-size: 1.1rem;
        font-weight: 950;
      }

      .vs-product-commerce > span {
        border-radius: 999px;
        background: #ecfdf5;
        padding: 0.35rem 0.65rem;
        color: #047857;
        font-size: 0.72rem;
        font-weight: 900;
      }

      @media (min-width: 860px) {
        .vs-product-row {
          grid-template-columns: 150px minmax(0, 1fr);
        }

        .vs-product-row-body {
          grid-template-columns: minmax(0, 1fr) minmax(260px, 0.46fr);
          align-items: center;
          padding: 1rem 1.1rem;
        }

        .vs-product-commerce {
          justify-content: flex-end;
          text-align: right;
        }
      }

      .vs-info-grid {
        display: grid;
        gap: 1rem;
        margin-top: -2.5rem;
        position: relative;
        z-index: 2;
      }

      @media (min-width: 768px) {
        .vs-info-grid {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }

      @media (min-width: 1024px) {
        .vs-store-layout {
          grid-template-columns: minmax(0, 1fr) 360px;
          align-items: start;
        }
      }

      .vs-info-tile {
        border: 1px solid hsl(var(--border));
        border-radius: 1rem;
        background: #ffffff;
        box-shadow: var(--shadow-card);
        padding: 1rem;
      }

      .vs-info-tile span {
        display: block;
        color: #64748b;
        font-size: 0.72rem;
        font-weight: 900;
        text-transform: uppercase;
      }

      .vs-info-tile strong {
        display: block;
        margin-top: 0.35rem;
        color: #0f172a;
        font-size: 0.95rem;
        line-height: 1.25;
      }

      .vs-map-frame {
        width: 100%;
        min-height: 230px;
        border: 0;
        border-radius: 1rem;
        background: #f1f5f9;
      }

      .vs-admin-divider {
        margin: 1.25rem 0;
        height: 1px;
        background: #e2e8f0;
      }

      .vs-action-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
      }

      .vs-product-actions {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.55rem;
        margin-top: 0.85rem;
      }

      .vs-product-row .vs-product-actions {
        flex: 1 1 100%;
        width: 100%;
        margin-top: 0.1rem;
      }

      .vs-product-actions button,
      .vs-product-actions a,
      .vs-manage-row button {
        border-radius: 0.75rem;
        padding: 0.7rem 0.8rem;
        font-size: 0.78rem;
        font-weight: 900;
        text-align: center;
      }

      .vs-buy-btn {
        background: #f59e0b;
        color: #0f172a;
      }

      .vs-wish-btn {
        border: 1px solid #e2e8f0;
        background: #ffffff;
        color: #334155;
      }

      .vs-wish-btn.active {
        border-color: #fecdd3;
        background: #fff1f2;
        color: #be123c;
      }

      .vs-pay-btn {
        border: 1px solid #bbf7d0;
        background: #ecfdf5;
        color: #047857;
      }

      .vs-qr-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 0.85rem;
      }

      .vs-qr-actions button,
      .vs-qr-actions a {
        border-radius: 999px;
        border: 1px solid #e2e8f0;
        background: #ffffff;
        padding: 0.55rem 0.8rem;
        color: #334155;
        font-size: 0.72rem;
        font-weight: 900;
      }

      .vs-payment-result {
        display: none;
        gap: 0.85rem;
        margin-top: 0.9rem;
        border: 1px solid #bbf7d0;
        border-radius: 0.9rem;
        background: #f0fdf4;
        padding: 0.85rem;
      }

      .vs-payment-result.show {
        display: grid;
      }

      .vs-payment-result img {
        width: 132px;
        height: 132px;
        border-radius: 0.8rem;
        border: 1px solid #d1fae5;
        background: #ffffff;
        object-fit: contain;
      }

      .vs-payment-result iframe {
        width: 132px;
        height: 132px;
        border: 1px solid #d1fae5;
        border-radius: 0.8rem;
        background: #ffffff;
      }

      @media (max-width: 480px) {
        .vs-product-actions {
          grid-template-columns: 1fr;
        }
      }

      .vs-manage-list {
        display: grid;
        gap: 0.65rem;
        margin-top: 0.9rem;
      }

      .vs-manage-row {
        display: grid;
        gap: 0.75rem;
        border: 1px solid #e2e8f0;
        border-radius: 0.9rem;
        background: #ffffff;
        padding: 0.8rem;
      }

      .vs-manage-row-main {
        min-width: 0;
      }

      .vs-manage-row-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .vs-manage-row-actions button {
        border: 1px solid #e2e8f0;
        background: #f8fafc;
        color: #334155;
      }

      .vs-manage-row-actions button[data-delete-product] {
        border-color: #fecaca;
        background: #fff1f2;
        color: #be123c;
      }

      .vs-toast {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        z-index: 80;
        max-width: min(360px, calc(100vw - 2rem));
        border: 1px solid rgba(15, 23, 42, 0.12);
        border-radius: 0.9rem;
        background: #0f172a;
        color: #ffffff;
        padding: 0.85rem 1rem;
        font-size: 0.88rem;
        font-weight: 800;
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.2);
        transform: translateY(16px);
        opacity: 0;
        transition: opacity 160ms ease, transform 160ms ease;
      }

      .vs-toast.show {
        transform: translateY(0);
        opacity: 1;
      }

      .vs-qr {
        display: grid;
        width: 96px;
        height: 96px;
        grid-template-columns: repeat(7, 1fr);
        gap: 3px;
        padding: 8px;
        border-radius: 0.9rem;
        border: 1px solid #e2e8f0;
        background: #ffffff;
      }

      .vs-qr i {
        border-radius: 2px;
        background: #0f172a;
      }

      .vs-qr i:nth-child(2n) { opacity: 0.32; }
      .vs-qr i:nth-child(5n) { opacity: 0.7; }

      .vs-qr-canvas {
        width: 112px;
        height: 112px;
        border: 1px solid #e2e8f0;

        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

      function dataUrlToBlob(dataUrl) {
        const [meta, data] = String(dataUrl || "").split(",");
        const mime = /data:([^;]+)/.exec(meta || "")?.[1] || "image/jpeg";
        const binary = atob(data || "");
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
        return new Blob([bytes], { type: mime });
      }

      async function uploadAutoshelfAsset(path, dataUrl) {
        if (!dataUrl) return "";
        if (!window.MM_API?.uploadImage) return dataUrl;
        try {
          const parts = String(path || "").split("/");
          const storeId = parts[1] || "general";
          const kind = parts[2] || "products";
          const uploaded = await window.MM_API.uploadImage({ data_url: dataUrl, store_id: storeId, kind });
          return uploaded.url || dataUrl;
        } catch {
          return dataUrl;
        }
      }

      function backendStoreToLocal(row) {
        const products = Array.isArray(row.products) ? row.products : Array.isArray(row.autoshelf_products) ? row.autoshelf_products : [];
        return {
          id: row.id,
          name: row.name,
          category: row.category,
          owner: row.owner_name,
          phone: row.phone || "",
          address: row.address,
          hours: row.hours || "",
          banner: row.banner_url || fallbackBanner,
          status: row.verification_status || "pending",
          verificationDoc: row.verification_doc || "",
          verificationPhoto: row.verification_photo_url || "",
          verifiedAt: row.verified_at || "",
          rejectedAt: row.rejected_at || "",
          products: products
            .filter((product) => product.is_active !== false)
            .map((product) => ({
              id: product.id,
              name: product.name,
              category: product.category || "",
              price: String(product.price_inr || 0),
              stock: String(product.stock_qty || 0),
              image: product.image_url || fallbackProduct,
              enhanced: Boolean(product.enhanced),
              uploadedAt: product.created_at || ""
            }))
        };
      }

      function storeToBackendPayload(store) {
        return {
          id: store.id,
          name: store.name,
          category: store.category || "Local Store",
          owner_name: store.owner || "Store owner",
          phone: store.phone || null,
          address: store.address || "",
          city: store.city || "Hyderabad",
          state: store.state || "Telangana",
          hours: store.hours || null,
          banner_url: store.banner || fallbackBanner,
          verification_status: statusLabel(store.status),
          verification_doc: store.verificationDoc || null,
          verification_photo_url: store.verificationPhoto || null,
          verified_at: store.verifiedAt || null,
          rejected_at: store.rejectedAt || null,
          beneficiary_name: store.bankBeneficiary || store.owner || "",
          account_number: store.bankAccount || "",
          ifsc_code: store.bankIfsc || "",
          account_type: store.bankAccountType || "current",
          pan: store.bankPan || ""
        };
      }

      function productToBackendPayload(storeId, product) {
        return {
          id: String(product.id),
          store_id: String(storeId),
          name: product.name,
          category: product.category || null,
          price_inr: Math.max(0, Math.round(Number(product.price || 0))),
          stock_qty: Math.max(0, Math.round(Number(product.stock || 0))),
          image_url: product.image || fallbackProduct,
          enhanced: Boolean(product.enhanced),
          is_active: true
        };
      }

      async function hydrateStoresFromBackend() {
        if (!window.MM_API?.autoshelfStores) return false;
        const data = await window.MM_API.autoshelfStores();
        const stores = (data.stores || []).map(backendStoreToLocal);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(stores));
        syncMallMazeData(stores);
        return true;
      }

      async function persistStoreToBackend(store) {
        if (!window.MM_API?.saveAutoshelfStore) return false;
        await window.MM_API.saveAutoshelfStore(storeToBackendPayload(store));
        return true;
      }

      async function deleteStoreFromBackend(storeId) {
        if (!window.MM_API?.deleteAutoshelfStore) return false;
        await window.MM_API.deleteAutoshelfStore(storeId);
        return true;
      }

      async function persistProductToBackend(storeId, product) {
        if (!window.MM_API?.saveAutoshelfProduct) return false;
        await window.MM_API.saveAutoshelfProduct(productToBackendPayload(storeId, product));
        return true;
      }

      async function deleteProductFromBackend(productId) {
        if (!window.MM_API?.deleteAutoshelfProduct) return false;
        await window.MM_API.deleteAutoshelfProduct(productId);
        return true;
      }

      async function recordStockEvent(storeId, productId, eventType, qtyDelta, stockAfter, reason) {
        if (!window.MM_API?.recordAutoshelfStockEvent) return false;
        await window.MM_API.recordAutoshelfStockEvent({
          store_id: storeId,
          product_id: productId,
          event_type: eventType,
          qty_delta: qtyDelta,
          stock_after: stockAfter,
          reason: reason || null
        });
        return true;
      }

      async function safeBackendWrite(label, action) {
        if (!backendConfigured()) return false;
        try {
          await action();
          return true;
        } catch (error) {
          console.warn(`AutoShelf ${label} saved locally but backend sync failed`, error);
          showToast(`${label} saved locally. Backend sync needs attention.`);
          return false;
        }
      }

      var money = window.money || function (value) {
        return `Rs ${Math.round(Number(value || 0)).toLocaleString("en-IN")}`;

      window.money = money;

      function virtualProductId(storeId, productId) {
        return `vsp-${storeId}-${productId}`;
      }

      function updateHeaderCounts() {
        const cart = readJson(CART_KEY, []);
        const wishlist = readJson(WISHLIST_KEY, []);
        const cartCount = cart.reduce((sum, item) => sum + Number(item.quantity || 1), 0);
        const wishCount = wishlist.length;
        const cartBadge = document.querySelector('a[href="cart.html"] .sm-count');
        const wishBadge = document.querySelector('a[href="wishlist.html"] .sm-count');
        if (cartBadge) cartBadge.textContent = String(cartCount);
        if (wishBadge) wishBadge.textContent = String(wishCount);

      function showToast(message) {
        let toast = document.getElementById("vs-toast");
        if (!toast) {
          toast = document.createElement("div");
          toast.id = "vs-toast";
          toast.className = "vs-toast";
          toast.setAttribute("role", "status");
          document.body.appendChild(toast);
        }
        toast.textContent = message;
        toast.classList.add("show");
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 2200);
      }

      function productPayload(store, product) {
        const id = virtualProductId(store.id, product.id);
        return {
          id,
          name: product.name,
          price: Number(product.price || 0),
          image: product.image || fallbackProduct,
          storeId: store.id,
          storeName: store.name,
          trustKey: "local",
          trustLabel: "Local store",
          deliveryPromise: "Local pickup"
        };
      }

      function addProductToCart(store, product) {
        const payload = productPayload(store, product);
        const cart = readJson(CART_KEY, []);
        const existing = cart.find((item) => String(item.id) === String(payload.id));
        if (existing) existing.quantity = Number(existing.quantity || 1) + 1;
        else cart.push({ ...payload, quantity: 1 });
        writeJson(CART_KEY, cart);
        updateHeaderCounts();
        showToast(`${product.name} added to cart.`);
      }

      function toggleProductWishlist(store, product) {
        const payload = productPayload(store, product);
        const wishlist = readJson(WISHLIST_KEY, []);
        const index = wishlist.findIndex((item) => String(item.id) === String(payload.id));
        if (index >= 0) {
          wishlist.splice(index, 1);
          showToast(`${product.name} removed from wishlist.`);
        } else {
          wishlist.unshift(payload);
          showToast(`${product.name} saved to wishlist.`);
        }
        writeJson(WISHLIST_KEY, wishlist);
        updateHeaderCounts();
      }

      function isWishlisted(productId) {
        const wishlist = readJson(WISHLIST_KEY, []);
        return wishlist.some((item) => String(item.id) === String(productId));

      function syncMallMazeData(stores) {
        const existingMalls = readJson(APP_MALLS_KEY, []).filter((mall) => mall.id !== VIRTUAL_MALL_ID);
        const existingStores = readJson(APP_STORES_KEY, []).filter((store) => !store.virtualSource);
        const existingProducts = readJson(APP_PRODUCTS_KEY, []).filter((product) => !product.virtualSource);
        const stock = readJson(APP_STOCK_KEY, {});

        const virtualMall = {
          id: VIRTUAL_MALL_ID,
          name: "MallMaze Local Stores",
          location: "Nearby local market",
          image: fallbackBanner,
          rating: 4.6,
          storeCount: stores.length,
          openHours: "Live local storefronts",
          description: "Admin-created virtual stores connected to nearby physical shops.",
          floors: 1,
          deliveryTime: "Local pickup",
          virtualSource: true
        };

        const mappedStores = stores.map((store) => ({
          id: store.id,
          mallId: VIRTUAL_MALL_ID,
          name: store.name,
          category: store.category,
          image: store.banner || fallbackBanner,
          rating: 4.4,
          floor: "Virtual Store",
          isOpen: true,
          productCount: (store.products || []).length,
          address: store.address,
          phone: store.phone,
          hours: store.hours,
          ownerName: store.owner,
          verificationStatus: store.status || "pending",
          virtualSource: true
        }));

        const mappedProducts = stores.flatMap((store) => (store.products || []).map((product) => {
          const id = virtualProductId(store.id, product.id);
          const stockCount = Number(product.stock || 0);
          stock[id] = stockCount;
          return {
            id,
            storeId: store.id,
            mallId: VIRTUAL_MALL_ID,
            name: product.name,
            price: Number(product.price || 0),
            originalPrice: Number(product.originalPrice || 0) || Number(product.price || 0),
            image: product.image || fallbackProduct,
            category: product.category || store.category || "Local Store",
            rating: 4.4,
            reviews: 0,
            inStock: stockCount > 0,
            stockCount,
            variants: [],
            storeName: store.name,
            mallName: "MallMaze Local Stores",
            deliveryTime: "Local pickup",
            badge: product.enhanced ? "Enhanced" : "Local",
            virtualSource: true
          };
        }));

        localStorage.setItem(APP_MALLS_KEY, JSON.stringify([virtualMall, ...existingMalls]));
        localStorage.setItem(APP_STORES_KEY, JSON.stringify([...mappedStores, ...existingStores]));
        localStorage.setItem(APP_PRODUCTS_KEY, JSON.stringify([...mappedProducts, ...existingProducts]));
        localStorage.setItem(APP_STOCK_KEY, JSON.stringify(stock));
      }

      function escapeHtml(value) {
        return String(value || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function slugify(value) {
        const slug = String(value || "store")
          .toLowerCase()
          .trim()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/(^-|-$)/g, "");
        return slug || `store-${Date.now()}`;
      }

      function qrCells() {
        return Array.from({ length: 49 }, (_, index) => `<i style="opacity:${index % 2 === 0 ? 1 : index % 5 === 0 ? 0.7 : 0.32}"></i>`).join("");
      }

      function drawFallbackQr(canvas, text, size = 180) {
        const s = Math.max(140, Number(size || 180));
        canvas.width = s;
        canvas.height = s;
        const ctx = canvas.getContext("2d");
        const cells = 29;
        const quiet = 3;
        const scale = Math.floor(s / (cells + quiet * 2));
        const offset = Math.floor((s - cells * scale) / 2);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, s, s);
        ctx.fillStyle = "#0f172a";

        function drawFinder(x, y) {
          ctx.fillRect(offset + x * scale, offset + y * scale, 7 * scale, 7 * scale);
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(offset + (x + 1) * scale, offset + (y + 1) * scale, 5 * scale, 5 * scale);
          ctx.fillStyle = "#0f172a";
          ctx.fillRect(offset + (x + 2) * scale, offset + (y + 2) * scale, 3 * scale, 3 * scale);
        }

        drawFinder(0, 0);
        drawFinder(cells - 7, 0);
        drawFinder(0, cells - 7);

        let hash = 2166136261;
        for (const ch of String(text || "")) {
          hash ^= ch.charCodeAt(0);
          hash = Math.imul(hash, 16777619);
        }

        for (let y = 0; y < cells; y++) {
          for (let x = 0; x < cells; x++) {
            const inFinder =
              (x < 8 && y < 8) ||
              (x >= cells - 8 && y < 8) ||
              (x < 8 && y >= cells - 8);
            if (inFinder) continue;
            const bit = ((Math.imul(x + 11, y + 17) + hash + x * 7 + y * 13) >>> 0) % 5;
            if (bit === 0 || bit === 3) {
              ctx.fillRect(offset + x * scale, offset + y * scale, scale, scale);
            }
          }
        }
      }

      function drawQrCanvases(root = document) {
        root.querySelectorAll("canvas[data-qr-text]").forEach((canvas) => {
          const text = canvas.getAttribute("data-qr-text") || "";
          if (!text) return;
          try {
            if (window.MM_QR?.draw) window.MM_QR.draw(canvas, text, 180);
            else drawFallbackQr(canvas, text, 180);
          } catch {
            drawFallbackQr(canvas, text, 180);
          }
        });
      }

      function downloadCanvasQr(canvas, fileName) {
        if (!canvas) return;
        const link = document.createElement("a");
        link.download = `${slugify(fileName || "store-qr")}.png`;

      async function generatePaymentQr(store, product) {
        const amountInput = document.getElementById("payment-amount");
        const amount = Math.max(1, Number(amountInput?.value || product?.price || 1));
        const result = document.getElementById("payment-qr-result");
        if (!window.MM_API?.hasApi?.()) {
          showToast("Start the backend API to generate Razorpay payment QR.");
          return;
        }
        if (result) {
          result.classList.add("show");
          result.innerHTML = `<p class="text-sm font-extrabold text-emerald-800">Generating Razorpay QR...</p>`;
        }
        try {
          const payload = await window.MM_API.createRazorpayQr({
            amount_inr: amount,
            store_id: store.id,
            product_id: product?.id || "",
            name: `${store.name} payment`,
            description: product ? `${product.name} from ${store.name}` : `Payment to ${store.name}`,
            local_reference: `AS-${store.id}-${Date.now()}`
          });
          const qr = payload.qr || {};
          if (result) {
            const image = qr.image_url
              ? `<img src="${escapeHtml(qr.image_url)}" alt="Razorpay UPI QR" />`
              : `<canvas data-qr-text="${escapeHtml(`razorpay:${qr.id || 'mock'}:${amount}`)}" class="vs-qr-canvas"></canvas>`;
            result.innerHTML = `
              <div class="flex flex-wrap items-center gap-3">

      function fileToEnhancedImage(file, opts = {}) {
        return new Promise((resolve, reject) => {
          if (!file) return resolve("");
          const reader = new FileReader();
          reader.onerror = () => reject(new Error("Could not read image."));
          reader.onload = () => {
            const img = new Image();
            img.onerror = () => reject(new Error("Could not load image."));
            img.onload = () => {
              const maxW = opts.banner ? 1400 : 900;
              const maxH = opts.banner ? 620 : 900;
              const scale = Math.min(maxW / img.width, maxH / img.height, 1);
              const w = Math.max(1, Math.round(img.width * scale));
              const h = Math.max(1, Math.round(img.height * scale));
              const canvas = document.createElement("canvas");
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext("2d");
              ctx.fillStyle = "#f8fafc";
              ctx.fillRect(0, 0, w, h);
              ctx.filter = "brightness(1.08) contrast(1.1) saturate(1.14)";
              ctx.drawImage(img, 0, 0, w, h);
              ctx.filter = "none";
              ctx.strokeStyle = "rgba(15, 23, 42, 0.08)";
              ctx.lineWidth = Math.max(2, Math.round(w * 0.004));
              ctx.strokeRect(1, 1, w - 2, h - 2);
              resolve(canvas.toDataURL("image/jpeg", 0.86));
            };
            img.src = String(reader.result || "");
          };
          reader.readAsDataURL(file);
        });
      }

      async function bindEnhancedUpload(inputId, previewId, onReady, opts = {}) {
        const input = document.getElementById(inputId);
        const preview = document.getElementById(previewId);
        if (!input) return;

        // Upgrade camera buttons to Pro Camera Studio
        if (inputId.includes("camera")) {
          const parentLabel = input.closest("label");
          if (parentLabel) {
            parentLabel.addEventListener("click", (e) => {
              if (window.ProductCameraStudio && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                e.preventDefault();
                const studio = new window.ProductCameraStudio({
                  onImagesChange: (imgs) => {
                    if (imgs && imgs[0]) {
                      const url = imgs[0].url;
                      onReady(url);
                      if (preview) {
                        preview.src = url;
                        preview.classList.add("show");
                      }
                    }
                  }
                });
                studio.openCamera();
              }
            });
          }
        }

        input.addEventListener("change", async () => {
          const file = input.files?.[0];
          if (!file) return;
          const enhanced = await fileToEnhancedImage(file, opts);
          onReady(enhanced);
          if (preview) {
            preview.src = enhanced;
            preview.classList.add("show");
          }
        });
      }

      function bindEnhancedUploadOptions(inputIds, previewId, onReady, opts = {}) {
        inputIds.forEach((id) => bindEnhancedUpload(id, previewId, onReady, opts));
      }

      function bindCreatePageSearch() {
        const topSearch = document.getElementById("local-search");
        const storeSearch = document.getElementById("store-search");
        const productSearch = document.getElementById("product-search");
        const storeCards = Array.from(document.querySelectorAll("[data-store-card]"));
        const productCards = Array.from(document.querySelectorAll("[data-product-card]"));
        const storeEmpty = document.getElementById("store-search-empty");
        const productEmpty = document.getElementById("product-search-empty");

        const applyFilters = () => {
          const sharedTerm = normalizeSearch(topSearch?.value);
          const storeTerm = normalizeSearch(storeSearch?.value);
          const productTerm = normalizeSearch(productSearch?.value);
          const storeTerms = [sharedTerm, storeTerm].filter(Boolean);
          const productTerms = [sharedTerm, productTerm].filter(Boolean);
          let visibleStores = 0;
          let visibleProducts = 0;

          storeCards.forEach((card) => {
            const haystack = normalizeSearch(card.getAttribute("data-search"));
            const isVisible = storeTerms.every((term) => haystack.includes(term));
            card.hidden = !isVisible;
            if (isVisible) visibleStores += 1;
          });

          productCards.forEach((card) => {
            const haystack = normalizeSearch(card.getAttribute("data-search"));
            const isVisible = productTerms.every((term) => haystack.includes(term));
            card.hidden = !isVisible;
            if (isVisible) visibleProducts += 1;
          });

          if (storeEmpty) storeEmpty.hidden = storeCards.length === 0 || visibleStores > 0;
          if (productEmpty) productEmpty.hidden = productCards.length === 0 || visibleProducts > 0;
          setResultCount("store-result-count", visibleStores, "store");
          setResultCount("product-result-count", visibleProducts, "product");
        };

        [topSearch, storeSearch, productSearch].filter(Boolean).forEach((input) => {
          input.addEventListener("input", applyFilters);
        });

        document.querySelectorAll("[data-focus-local-search]").forEach((link) => {
          link.addEventListener("click", (event) => {
            if (!topSearch) return;
            event.preventDefault();
            topSearch.focus();
            document.getElementById("stores")?.scrollIntoView({ behavior: "smooth", block: "start" });
          });
        });

        applyFilters();
      }

      function bindStoreProductSearch() {
        const input = document.getElementById("store-product-search");
        const cards = Array.from(document.querySelectorAll("[data-store-product-card]"));
        const empty = document.getElementById("store-product-search-empty");

        const applyFilter = () => {
          const term = normalizeSearch(input?.value);
          let visible = 0;

          cards.forEach((card) => {
            const haystack = normalizeSearch(card.getAttribute("data-search"));
            const isVisible = !term || haystack.includes(term);
            card.hidden = !isVisible;
            if (isVisible) visible += 1;
          });

          if (empty) empty.hidden = cards.length === 0 || visible > 0;
          setResultCount("store-product-result-count", visible, "product");
        };

        if (input) input.addEventListener("input", applyFilter);
        applyFilter();
      }

      function bindInventoryControls(storeId) {
        document.querySelectorAll("[data-stock-delta]").forEach((button) => {
          button.addEventListener("click", async () => {
            const productId = button.getAttribute("data-product-id");
            const delta = Number(button.getAttribute("data-stock-delta") || 0);
            let changedProduct = null;
            const updatedStore = updateStore(storeId, (draft) => {
              const product = (draft.products || []).find((item) => String(item.id) === String(productId));
              if (!product) return;
              product.stock = String(Math.max(0, Number(product.stock || 0) + delta));
              changedProduct = { ...product };
            });
            if (updatedStore && changedProduct) {
              await safeBackendWrite("Inventory", async () => {
                await persistProductToBackend(storeId, changedProduct);
                await recordStockEvent(
                  storeId,
                  changedProduct.id,
                  delta >= 0 ? "stock_in" : "stock_out",
                  delta,
                  Number(changedProduct.stock || 0),
                  "Quick inventory control"
                );
              });
            }
            renderStorePage(getStoreById(storeId));
            showToast("Inventory updated.");
          });
        });

        document.querySelectorAll("[data-delete-product]").forEach((button) => {
          button.addEventListener("click", async () => {
            const productId = button.getAttribute("data-delete-product");
            if (!window.confirm("Remove this product from the storefront?")) return;
            let removed = null;
            updateStore(storeId, (draft) => {
              removed = (draft.products || []).find((item) => String(item.id) === String(productId)) || null;
              draft.products = (draft.products || []).filter((item) => String(item.id) !== String(productId));
            });
            await safeBackendWrite("Product delete", async () => {
              if (removed) await recordStockEvent(storeId, removed.id, "delete", -Number(removed.stock || 0), 0, "Product removed");
              await deleteProductFromBackend(productId);
            });
            renderStorePage(getStoreById(storeId));
            showToast("Product removed.");
          });
        });
      }

      function updateStore(id, mutator) {
        const stores = readStores();
        const index = stores.findIndex((store) => String(store.id) === String(id));
        if (index === -1) return null;
        const draft = { ...stores[index], products: [...(stores[index].products || [])] };
        mutator(draft);
        stores[index] = draft;
        writeStores(stores);
        return draft;

      const storeId = params.get("store");

      async function initAutoshelf() {
        app.innerHTML = `
          <section class="container mx-auto px-4 py-16">
            <div class="mm-card mm-card-pad">
              <p class="vs-section-kicker">AutoShelf</p>
              <h1 class="mt-1 text-3xl font-extrabold text-slate-900">Loading local stores</h1>
              <p class="mt-2 text-sm text-muted-foreground">Loading your local store workspace.</p>
            </div>
          </section>
        `;
        try {
          const hydrated = await hydrateStoresFromBackend();
          if (hydrated) showToast("AutoShelf synced with backend.");
        } catch (error) {
          console.warn("AutoShelf backend hydrate failed; using local cache.", error);
          showToast("Using local AutoShelf cache. Backend sync needs attention.");
        }
        const activeStore = storeId ? getStoreById(storeId) : null;
        if (storeId && activeStore) {
          renderAutoshelfStorePage(activeStore);
        } else {
          renderCreatePage();
          if (storeId && !activeStore) showToast("Store not found. Showing all local stores.");
        }
      }

      initAutoshelf();
    
      function initAutoshelfLocationBanner() {
        const text = document.getElementById("autoshelf-loc-text");
        const useBtn = document.getElementById("autoshelf-use-loc-btn");
        const changeBtn = document.getElementById("autoshelf-change-loc-btn");

        const updateLocText = () => {
          const loc = window.MM_GEO ? window.MM_GEO.getSavedLocation() : null;
          if (text) text.textContent = loc ? loc.label : "Hyderabad (Default)";
        };
        updateLocText();

        window.addEventListener("mm:location-changed", updateLocText);

        useBtn?.addEventListener("click", async () => {
          if (!window.MM_GEO?.getCurrentPosition) return;
          try {
            useBtn.disabled = true;
            const loc = await window.MM_GEO.getCurrentPosition();
            updateLocText();
          } catch (e) {
            alert(e.message || "Location permission denied.");
          } finally {
            useBtn.disabled = false;
          }
        });

        changeBtn?.addEventListener("click", () => {
          if (window.MM_GEO?.openLocationModal) {
            window.MM_GEO.openLocationModal();
          }
        });
      }
      setTimeout(initAutoshelfLocationBanner, 200);
  
    </script>
  </body>
</html>
