<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MallMaze - Products</title>
    <meta name="description" content="Browse products from nearby malls and stores. Filter by category, price, and best deals." />
    <meta property="og:title" content="MallMaze - Products" />
    <meta property="og:description" content="Browse products from nearby malls and stores. Find the best deals fast." />
    <link rel="stylesheet" href="assets/css/tailwind.css">
    <link rel="stylesheet" href="assets/css/react-styles.css">
    <link rel="stylesheet" href="assets/css/styles.css">
      <link rel="icon" type="image/x-icon" href="assets/media/favicon.ico">
  </head>
  <body class="bg-white">
    <nav></nav>
    <main class="container mx-auto px-4 mm-page">
      <div class="flex flex-col gap-1 md:flex-row md:items-center md:justify-between mb-3 md:mb-5">
        <div>
          <h1 class="font-display text-2xl sm:text-3xl font-extrabold text-slate-900">Products</h1>
          <p class="text-xs sm:text-sm text-slate-500">Search, filter, and discover verified local store products.</p>
        </div>
      </div>

      <!-- Single Horizontal Search & Filter Block -->
      <section class="products-toolbar sticky z-20 top-16 md:top-20 bg-white/95 backdrop-blur-md border border-slate-200 rounded-xl sm:rounded-2xl p-2.5 sm:p-3 md:p-4 shadow-sm mb-4 md:mb-6">
        <div class="space-y-2 sm:space-y-3">
          <!-- Row 1: Compact Horizontal Search Bar (Single Row on Mobile & Desktop) -->
          <form id="shop-search-form" class="flex items-center gap-2" onsubmit="event.preventDefault();">
            <div class="flex-1 relative flex items-center">
              <svg class="absolute left-3 h-4 w-4 text-slate-400 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              <input id="search-input" type="search" placeholder="Search products, brands..." class="w-full rounded-xl border border-slate-200 bg-slate-50 pl-9 pr-3 py-2 text-sm text-slate-900 focus:bg-white focus:border-slate-900 focus:outline-none focus:ring-1 focus:ring-slate-900/15" autocomplete="off" />
            </div>
            <button type="submit" id="shop-search-btn" class="shrink-0 inline-flex items-center justify-center gap-1.5 rounded-xl bg-slate-900 px-4 py-2 text-xs sm:text-sm font-bold text-white hover:bg-slate-800 transition shadow-sm">
              <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              <span>Search</span>
            </button>
          </form>

          <!-- Row 2: Single Horizontal Scrollable Filter Rail (Zero Vertical Clutter) -->
          <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-0.5" style="-webkit-overflow-scrolling: touch;">
            <!-- Category -->
            <div class="shrink-0">
              <select id="category-filter" class="rounded-full border border-slate-200 bg-slate-50 hover:bg-white px-3 py-1 text-xs font-semibold text-slate-800 focus:border-slate-900 focus:outline-none shadow-xs transition cursor-pointer">
                <option value="">All Categories</option>
              </select>
            </div>

            <!-- Sort -->
            <div class="shrink-0">
              <select id="sort-filter" class="rounded-full border border-slate-200 bg-slate-50 hover:bg-white px-3 py-1 text-xs font-semibold text-slate-800 focus:border-slate-900 focus:outline-none shadow-xs transition cursor-pointer">
                <option value="rec">Recommended</option>
                <option value="reco" style="display:none">Recommended</option>
                <option value="price_asc">Price: Low &rarr; High</option>
                <option value="price_desc">Price: High &rarr; Low</option>
                <option value="discount">Best Discount</option>
                <option value="rating_desc">Top Rated</option>
              </select>
            </div>

            <!-- Budget -->
            <div class="shrink-0">
              <select id="price-filter" class="rounded-full border border-slate-200 bg-slate-50 hover:bg-white px-3 py-1 text-xs font-semibold text-slate-800 focus:border-slate-900 focus:outline-none shadow-xs transition cursor-pointer">
                <option value="">Price: Any</option>
                <option value="0-499">Under ₹500</option>
                <option value="0-999">Under ₹1,000</option>
                <option value="500-999">₹500 - ₹999</option>
                <option value="1000-1999">₹1,000 - ₹1,999</option>
                <option value="2000-999999">₹2,000+</option>
              </select>
            </div>

            <!-- Quick Chips & Reset -->
            <button type="button" class="shrink-0 mm-chip text-xs px-3 py-1 rounded-full font-medium" data-q="discount">Deals</button>
            <button type="button" class="shrink-0 mm-chip text-xs px-3 py-1 rounded-full font-medium" data-q="rating">Top Rated</button>
            <button type="button" class="shrink-0 mm-chip text-xs px-3 py-1 rounded-full font-medium" data-q="price-low">Under ₹1,000</button>
            <button type="button" id="filters-reset" class="shrink-0 text-xs font-bold text-rose-600 hover:underline px-2">Reset</button>
          </div>
        </div>
      </section>

      <!-- Main Full-Width Product Grid -->
      <div id="products-list" class="product-grid"></div>

      <!-- Recently Viewed Section -->
      <section class="mt-14 pt-8 border-t border-slate-200">
        <div class="mb-4 flex items-end justify-between gap-4">
          <div>
            <h2 class="font-display text-lg font-bold text-slate-900">Recently Viewed</h2>
            <p class="text-xs text-slate-500">Pick up where you left off</p>
          </div>
          <a href="compare.html" class="text-xs font-bold text-amber-600 hover:underline">Compare All →</a>
        </div>
        <div id="rv-rail" class="flex gap-4 overflow-x-auto pb-2"></div>
      </section>
    </main>
    <footer class="bg-slate-900 text-white py-10 border-t border-slate-800 mt-14">
      <div class="container mx-auto px-4">
        <div class="flex flex-col gap-6 md:flex-row md:items-center md:justify-between">
          <div>
            <h3 class="font-display text-lg font-bold text-white">MallMaze</h3>
            <p class="text-sm text-slate-400 mt-1">Find the best offer.</p>
          </div>
          <div class="flex flex-wrap gap-3 text-sm">
            <a href="index.html" class="text-slate-300 hover:text-white">Home</a>
            <a href="products.html" class="text-slate-300 hover:text-white">Products</a>
            <a href="deals.html" class="text-slate-300 hover:text-white">Deals</a>
            <a href="cart.html" class="text-slate-300 hover:text-white">Cart</a>
          </div>
        </div>
        <div class="border-t border-slate-800 pt-6 mt-6"><p class="text-sm text-slate-500">&copy; 2026 MallMaze. All rights reserved.</p></div>
      </div>
    </footer>
    <script src="assets/js/config.js" defer></script>
    <script src="assets/js/api-client.js" defer></script>
    <script src="assets/js/runtime-guard.js" defer></script>
    <script src="assets/js/marketplace.js" defer></script>
    <script src="assets/js/main.js?v=marketplace-20260614" defer></script>
  </body>
</html>
