<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MallMaze - Products</title>
    <meta name="description" content="Browse products from nearby malls and stores. Filter by category, price, and best deals." />
    <meta property="og:title" content="MallMaze - Products" />
    <meta property="og:description" content="Browse products from nearby malls and stores. Find the best deals fast." />
    <link rel="stylesheet" href="assets/css/tailwind.css">
    <link rel="stylesheet" href="assets/css/react-styles.css">
    <link rel="stylesheet" href="assets/css/styles.css">
      <link rel="icon" type="image/x-icon" href="assets/media/favicon.ico">
  </head>
  <body class="bg-white">
    <nav></nav>
    <main class="container mx-auto px-4 mm-page">
      <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between mb-6">
        <div>
          <h1 class="mm-page-title">Products</h1>
          <p class="mm-page-sub">Search, filter, compare, and choose products with live availability confidence.</p>
        </div>
      </div>

      <!-- Single Horizontal Search & Filter Block -->
      <section class="products-toolbar sticky z-20 top-20 bg-white/95 backdrop-blur-md border border-slate-200 rounded-2xl p-4 md:p-5 shadow-sm mb-8">
        <div class="space-y-3">
          <!-- Row 1: Search Input & Action Button -->
          <form id="shop-search-form" class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-center" onsubmit="event.preventDefault();">
            <div class="flex-1 relative flex items-center">
              <svg class="absolute left-3.5 h-4 w-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              <input id="search-input" type="search" placeholder="Search for rice, headphones, perfume, brands..." class="w-full rounded-xl border border-slate-300 bg-slate-50 pl-10 pr-4 py-2.5 text-sm text-slate-900 focus:bg-white focus:border-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-900/10" autocomplete="off" />
            </div>
            <button type="submit" id="shop-search-btn" class="inline-flex items-center justify-center gap-2 rounded-xl bg-slate-900 px-6 py-2.5 text-sm font-bold text-white hover:bg-slate-800 transition shadow-sm">
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              Search
            </button>
          </form>

          <!-- Row 2: Single Horizontal Filter Controls & Quick Chips -->
          <div class="pt-3 border-t border-slate-100 flex flex-wrap items-center justify-between gap-3">
            <div class="flex flex-wrap items-center gap-3">
              <span class="text-xs font-extrabold uppercase tracking-wider text-slate-900 flex items-center gap-1.5">
                <svg class="h-3.5 w-3.5 text-slate-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
                Filters
              </span>

              <!-- Category -->
              <div class="flex items-center gap-1.5">
                <span class="text-xs font-semibold text-slate-600">Category:</span>
                <select id="category-filter" class="rounded-xl border border-slate-300 bg-white px-3 py-1.5 text-xs font-bold text-slate-900 focus:border-slate-900 focus:outline-none shadow-xs">
                  <option value="">All Categories</option>
                </select>
              </div>

              <!-- Sort -->
              <div class="flex items-center gap-1.5">
                <span class="text-xs font-semibold text-slate-600">Sort:</span>
                <select id="sort-filter" class="rounded-xl border border-slate-300 bg-white px-3 py-1.5 text-xs font-bold text-slate-900 focus:border-slate-900 focus:outline-none shadow-xs">
                  <option value="reco">Recommended</option>
                  <option value="price_asc">Price: Low to High</option>
                  <option value="price_desc">Price: High to Low</option>
                  <option value="discount">Best Discount</option>
                  <option value="rating_desc">Top Rated</option>
                </select>
              </div>

              <!-- Budget -->
              <div class="flex items-center gap-1.5">
                <span class="text-xs font-semibold text-slate-600">Budget:</span>
                <select id="price-filter" class="rounded-xl border border-slate-300 bg-white px-3 py-1.5 text-xs font-bold text-slate-900 focus:border-slate-900 focus:outline-none shadow-xs">
                  <option value="">Any price</option>
                  <option value="0-499">Under Rs 500</option>
                  <option value="0-999">Under Rs 1000</option>
                  <option value="500-999">Rs 500 - 999</option>
                  <option value="1000-1999">Rs 1000 - 1999</option>
                  <option value="2000-999999">Rs 2000+</option>
                </select>
              </div>
            </div>

            <!-- Quick Chips & Reset -->
            <div class="flex flex-wrap items-center gap-2" aria-label="Quick filters">
              <button type="button" class="mm-chip" data-q="discount">Deals</button>
              <button type="button" class="mm-chip" data-q="rating">Top rated</button>
              <button type="button" class="mm-chip" data-q="price-low">Under Rs 1000</button>
              <button type="button" id="filters-reset" class="text-xs font-bold text-rose-600 hover:underline ml-1">Reset</button>
            </div>
          </div>
        </div>
      </section>

      <!-- Main Full-Width Product Grid -->
      <div id="products-list" class="product-grid"></div>

      <!-- Recently Viewed Section -->
      <section class="mt-14 pt-8 border-t border-slate-200">
        <div class="mb-4 flex items-end justify-between gap-4">
          <div>
            <h2 class="font-display text-lg font-bold text-slate-900">Recently Viewed</h2>
            <p class="text-xs text-slate-500">Pick up where you left off</p>
          </div>
          <a href="compare.html" class="text-xs font-bold text-amber-600 hover:underline">Compare All →</a>
        </div>
        <div id="rv-rail" class="flex gap-4 overflow-x-auto pb-2"></div>
      </section>
    </main>
    <footer class="bg-slate-900 text-white py-10 border-t border-slate-800 mt-14">
      <div class="container mx-auto px-4">
        <div class="flex flex-col gap-6 md:flex-row md:items-center md:justify-between">
          <div>
            <h3 class="font-display text-lg font-bold text-white">MallMaze</h3>
            <p class="text-sm text-slate-400 mt-1">Find the best offer.</p>
          </div>
          <div class="flex flex-wrap gap-3 text-sm">
            <a href="index.html" class="text-slate-300 hover:text-white">Home</a>
            <a href="products.html" class="text-slate-300 hover:text-white">Products</a>
            <a href="deals.html" class="text-slate-300 hover:text-white">Deals</a>
            <a href="cart.html" class="text-slate-300 hover:text-white">Cart</a>
          </div>
        </div>
        <div class="border-t border-slate-800 pt-6 mt-6"><p class="text-sm text-slate-500">&copy; 2026 MallMaze. All rights reserved.</p></div>
      </div>
    </footer>
    <script src="assets/js/config.js" defer></script>
    <script src="assets/js/api-client.js" defer></script>
    <script src="assets/js/runtime-guard.js" defer></script>
    <script src="assets/js/marketplace.js" defer></script>
    <script src="assets/js/main.js?v=marketplace-20260614" defer></script>
  </body>
</html>
