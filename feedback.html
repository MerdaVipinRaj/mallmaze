<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MallMaze - Feedback</title>
    <link rel="stylesheet" href="assets/css/tailwind.css">
    <link rel="stylesheet" href="assets/css/react-styles.css">
  </head>
  <body class="bg-white">
    <nav></nav>
    <main class="container mx-auto px-4 py-10">
      <div class="flex items-end justify-between gap-4 mb-6">
        <div>
          <h1 class="text-3xl md:text-4xl font-bold">Feedback</h1>
          <p class="text-sm text-muted-foreground mt-1">Help us improve MallMaze.</p>
        </div>
        <a href="index.html" class="hidden md:inline-flex items-center gap-2 rounded-lg border px-4 py-2 text-sm font-semibold hover:bg-muted">Back home â†’</a>
      </div>

      <section class="max-w-2xl rounded-2xl border border-border bg-card p-5 shadow-card">
        <form id="fb-form" class="space-y-3">
          <input id="fb-email" type="email" placeholder="Your email (optional)" class="w-full rounded-xl border px-3.5 py-2.5" />
          <select id="fb-topic" class="w-full rounded-xl border px-3.5 py-2.5">
            <option value="bug">Bug</option>
            <option value="feature">Feature request</option>
            <option value="delivery">Delivery</option>
            <option value="scan">Scan&Go</option>
            <option value="payment">Payment</option>
            <option value="other">Other</option>
          </select>
          <textarea id="fb-msg" rows="5" placeholder="Write your feedbackâ€¦" class="w-full rounded-xl border px-3.5 py-2.5"></textarea>
          <button class="rounded-xl bg-primary px-5 py-3 text-white font-semibold" type="submit">Send</button>
          <p class="text-xs text-muted-foreground">Saves locally for now; production feedback can be routed through the backend support API.</p>
        </form>
      </section>
    </main>

    <footer class="bg-slate-900 text-white py-10 border-t border-slate-800 mt-14">
      <div class="container mx-auto px-4">
        <div class="flex flex-col gap-6 md:flex-row md:items-center md:justify-between">
          <div>
            <h3 class="font-display text-lg font-bold text-white">MallMaze</h3>
            <p class="text-sm text-slate-400 mt-1">Thanks for helping us improve.</p>
          </div>
          <div class="flex flex-wrap gap-3 text-sm">
            <a href="index.html" class="text-slate-300 hover:text-white">Home</a>
            <a href="products.html" class="text-slate-300 hover:text-white">Products</a>
            <a href="scan.html" class="text-slate-300 hover:text-white">Scan&Go</a>
          </div>
        </div>
        <div class="border-t border-slate-800 pt-6 mt-6"><p class="text-sm text-slate-500">Â© 2026 MallMaze. All rights reserved.</p></div>
      </div>
    </footer>

    <script src="assets/js/config.js" defer></script>
    <script src="assets/js/api-client.js" defer></script>
    <script src="assets/js/runtime-guard.js" defer></script>
    <script src="assets/js/main.js?v=20260505-2" defer></script>
    <script>
      (function(){
        const k = 'mm_feedback';
        const form = document.getElementById('fb-form');
        if (!form) return;
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const rec = {
            at: new Date().toISOString(),
            email: String(document.getElementById('fb-email')?.value || '').trim(),
            topic: String(document.getElementById('fb-topic')?.value || 'other'),
            message: String(document.getElementById('fb-msg')?.value || '').trim()
          };
          const list = (()=>{ try{ return JSON.parse(localStorage.getItem(k)||'[]'); } catch { return []; } })();
          list.unshift(rec);
          localStorage.setItem(k, JSON.stringify(list.slice(0, 50)));
          if (window.toast) window.toast('Feedback saved. Thank you!', { type: 'ok', title: 'Feedback' });
          else alert('Feedback saved. Thank you!');
          form.reset();
        });
      })();
    </script>
  </body>
</html>
