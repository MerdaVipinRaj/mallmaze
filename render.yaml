# Render Blueprint — MallMaze (frontend + API + Postgres)
# Dashboard: New > Blueprint > connect this repo > Apply

databases:
  - name: mallmaze-db
    plan: free
    databaseName: mallmaze
    user: mallmaze

services:
  - type: web
    name: mallmaze
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mallmaze-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_DEV_MODE
        value: "true"
      - key: DELIVERY_PROVIDER
        value: manual_ops
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
