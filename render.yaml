# Render Blueprint — MallMaze Web Service
# Dashboard: New > Blueprint > connect this repo > Apply

services:
  - type: web
    name: mallmaze-live
    runtime: node
    plan: free
    branch: master
    autoDeploy: true
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.14.0"
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_DEV_MODE
        value: "true"
      - key: DELIVERY_PROVIDER
        value: manual_ops
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
